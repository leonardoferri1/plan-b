name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @plan-b/api prisma:generate

      # The API typechecks against the shared package's emitted declarations.
      - name: Build the shared package
        run: pnpm --filter @plan-b/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite drives a real WebGL scene, so it needs the full Chromium rather than the
      # headless shell.
      - name: Install Playwright Chromium
        run: pnpm --filter @plan-b/web exec playwright install --with-deps chromium

      - name: Build the web app
        run: pnpm --filter @plan-b/shared build && pnpm --filter @plan-b/web build

      - name: Run Playwright
        run: pnpm --filter @plan-b/web test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  database:
    name: migration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plan-b
          POSTGRES_PASSWORD: plan-b
          POSTGRES_DB: plan-b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plan-b -d plan-b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://plan-b:plan-b@localhost:5432/plan-b?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply the committed migrations
        run: pnpm --filter @plan-b/api exec prisma migrate deploy

      # Catches a schema.prisma edit that nobody turned into a migration: the diff between the
      # live database and the datamodel must be empty.
      - name: Assert the schema matches the migrations
        run: >-
          pnpm --filter @plan-b/api exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      # The seed is TypeScript and imports the generated client's types.
      - name: Generate Prisma client
        run: pnpm --filter @plan-b/api exec prisma generate

      - name: Seed the demo project
        run: pnpm --filter @plan-b/api exec ts-node prisma/seed.ts
