services:
  postgres:
    image: postgres:16-alpine
    container_name: plan-b-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plan-b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plan-b}
      POSTGRES_DB: ${POSTGRES_DB:-plan-b}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - plan-b-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-plan-b} -d ${POSTGRES_DB:-plan-b}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: plan-b-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    profiles: ['tools']

volumes:
  plan-b-pgdata:
