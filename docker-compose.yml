services:
  postgres:
    image: postgres:16-alpine
    container_name: spacecraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spacecraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spacecraft}
      POSTGRES_DB: ${POSTGRES_DB:-spacecraft}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - spacecraft-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-spacecraft} -d ${POSTGRES_DB:-spacecraft}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: spacecraft-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    profiles: ['tools']

volumes:
  spacecraft-pgdata:
